<!DOCTYPE html>
<html lang="en"><head>
      
    


  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Slideshow with Fullscreen</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100;300&amp;display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Lexend', sans-serif;
      margin: 0;
      padding: 0;
      background-color: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .slideshow-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      padding-bottom: 50px;
      overflow: hidden;
      border-radius: 20px;
      background-color: transparent;
      box-sizing: border-box;
    }

    .slides {
      display: flex;
      height: 100%;
      transition: transform 0.5s ease;
    }

    .slide {
      width: 100vw;
      height: 100%;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 20px;
    }

    /* Side Shadows */
    .side-shadow {
      position: absolute;
      top: 0;
      width: 120px;
      height: 100%;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 5;
      border-radius: 20px 0 0 20px;
    }

    .side-shadow.left {
      left: 0;
      background: linear-gradient(to right, rgba(0,0,0,0.4), transparent);
    }

    .side-shadow.right {
      right: 0;
      background: linear-gradient(to left, rgba(0,0,0,0.4), transparent);
      border-radius: 0 20px 20px 0;
    }

    .slideshow-container:hover .side-shadow {
      opacity: 1;
    }

    /* Navigation Buttons */
    .prev, .next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      color: white;
      border: none;
      font-size: 30px;
      padding: 10px 14px;
      cursor: pointer;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.3s ease;
      border-radius: 20px;
      user-select: none;
    }

    .prev { left: 10px; }
    .next { right: 10px; }

    .slideshow-container:hover .prev,
    .slideshow-container:hover .next {
      opacity: 1;
    }

    /* Dots */
    .dot-container {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
    }

    .dot {
      height: 10px;
      width: 10px;
      margin: 0 5px;
      background-color: #bbb;
      border-radius: 50%;
      display: inline-block;
      cursor: pointer;
    }

    .dot.active {
      background-color: #444;
    }

    /* Page Number Indicator */
    .page-number {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
      color: white;
      z-index: 10;
      background-color: rgba(0, 0, 0, 0.3);
      padding: 5px 15px;
      border-radius: 20px;
      font-weight: 300;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .slideshow-container:hover .page-number {
      opacity: 1;
    }

    /* Fullscreen button */
    .fullscreen-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.3);
      color: white;
      border: none;
      font-size: 20px;
      padding: 8px 12px;
      cursor: pointer;
      border-radius: 10px;
      z-index: 20;
      transition: background 0.3s ease;
    }

    .fullscreen-btn:hover {
      background: rgba(0,0,0,0.6);
    }

  </style>
</head>
<body>

<div class="slideshow-container" id="slideshow">
  <!-- Side Shadows -->
  <div class="side-shadow left"></div>
  <div class="side-shadow right"></div>

  <div class="slides" id="slidesContainer" style="width: 300vw; transform: translateX(0vw);">
    <div class="slide"><img src="https://i.imgur.com/HLLpBMN.jpeg" alt="Slide 1" loading="eager"></div>
    <div class="slide"><img src="https://i.imgur.com/wBHoWzq.jpeg" alt="Slide 2" loading="eager"></div>
    <div class="slide"><img src="https://i.imgur.com/BkG99VM.jpeg" alt="Slide 3" loading="eager"></div>
  </div>

  <!-- Buttons -->
  <button class="prev" onclick="moveSlide(-1)">❮</button>
  <button class="next" onclick="moveSlide(1)">❯</button>

  <!-- Page Number Indicator -->
  <div class="page-number" id="pageNumber">1 / 3</div>

  <!-- Fullscreen Button -->
  <button class="fullscreen-btn" id="fullscreenBtn">⛶</button>
</div>

<div class="dot-container" id="dotContainer"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div>

<script>
  const slidesContainer = document.getElementById('slidesContainer');
  const slides = slidesContainer.querySelectorAll('.slide');
  const dotContainer = document.getElementById('dotContainer');
  const pageNumber = document.getElementById('pageNumber');
  const slideshow = document.getElementById('slideshow');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  let currentIndex = 0;

  slidesContainer.style.width = `${slides.length * 100}vw`;

  slides.forEach((_, i) => {
    const dot = document.createElement('span');
    dot.classList.add('dot');
    dot.addEventListener('click', () => showSlide(i));
    dotContainer.appendChild(dot);
  });

  const dots = dotContainer.querySelectorAll('.dot');

  function showSlide(index) {
    if (index >= slides.length) index = 0;
    if (index < 0) index = slides.length - 1;
    currentIndex = index;
    slidesContainer.style.transform = `translateX(-${currentIndex * 100}vw)`;
    dots.forEach(dot => dot.classList.remove('active'));
    dots[currentIndex].classList.add('active');
    updatePageNumber();
  }

  function moveSlide(step) {
    showSlide(currentIndex + step);
  }

  function updatePageNumber() {
    pageNumber.textContent = `${currentIndex + 1} / ${slides.length}`;
  }

  // Fullscreen toggle
  fullscreenBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      slideshow.requestFullscreen().catch(err => {
        alert(`Error attempting to enable fullscreen: ${err.message}`);
      });
    } else {
      document.exitFullscreen();
    }
  });

  // Initialize
  showSlide(currentIndex);
</script>




      
    </body></html>
